name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Build, sizes and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: forge build --sizes
      - run: forge test
