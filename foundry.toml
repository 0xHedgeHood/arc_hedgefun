[profile.default]
# The testnet deployment (script/testnet/DeployV2Testnet.s.sol) reads the vendored Uniswap V3 factory bytecode and writes its
# address book; SeedTestnet reads that book. Nothing else touches the filesystem.
fs_permissions = [
  { access = "read", path = "./data" },
  { access = "read", path = "./lib/v4-core/test/bin/v3Factory.bytecode" },
  { access = "read-write", path = "./deploy/testnet-v2.json" },
  { access = "read-write", path = "./deploy/testnet-v2.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-whitelist.json" },
  { access = "read-write", path = "./deploy/testnet-v2-whitelist.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-stock-extension.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-stock-extension.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-fees.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-fees.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-creator.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-creator.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-fresh-creator.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-fresh-creator.dryrun.json" },
  { access = "read-write", path = "./deploy/testnet-v2-release.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-release.dryrun.json" },
  { access = "read", path = "./deploy/v2-listings-plan.json" },
  { access = "read-write", path = "./deploy/safe-register-lot-reserve.json" },
  { access = "read", path = "./deploy/mainnet-v2-release.json" },
  { access = "read", path = "./deploy/mainnet-v2-oracles.json" },
  { access = "read-write", path = "./deploy/mainnet-v2-core.candidate.json" },
  { access = "read-write", path = "./deploy/mainnet-v2-core.dryrun.json" },
  { access = "read", path = "./deploy/testnet-v2-fees.json" },
  { access = "read", path = "./deploy/testnet-v2-release.json" },
  { access = "read", path = "./deploy/testnet-v2-venue.json" },
  { access = "read-write", path = "./deploy/testnet-v2-venue.candidate.json" },
  { access = "read-write", path = "./deploy/testnet-v2-venue.dryrun.json" },
  { access = "read-write", path = "./deploy/arc-v2-core.candidate.json" },
  { access = "read-write", path = "./deploy/arc-v2-core.dryrun.json" },
]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
# No metadata hash in the deployed bytecode. A protocol that says "immutable, verify it yourself" should build
# byte-identically from any clone: with the default (ipfs) the trailing metadata hash covers the source paths, so the
# same commit compiled in a different directory produces different bytecode -- and different CREATE2 addresses.
bytecode_hash = "none"
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
]

# ffi ONLY here, never globally: `FOUNDRY_PROFILE=emergency forge test --mc Emergency` lets test/Emergency.t.sol take its
# calldata from emergency/build.py and assert it byte-equal to abi.encodeCall. Everything else is inherited.
[profile.emergency]
ffi = true

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
publicnode = "https://robinhood-rpc.publicnode.com"
blockmachine = "https://rpc-robinhood.blockmachine.io"
# Arc (5042). USDC transfers call a native precompile that stock Foundry lacks: fork tests need Circle's arc-forge
# with `--network arc`. See docs/ARC.md.
arc = "https://rpc.mainnet.arc.io"

[lint]
lint_on_build = false
